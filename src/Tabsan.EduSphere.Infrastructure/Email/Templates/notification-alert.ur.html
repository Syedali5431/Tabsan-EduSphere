<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSphere اطلاع — Tabsan EduSphere</title>
</head>
<body dir="rtl" style="margin:0;padding:0;background:#f8f9fa;font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.8;color:#212529;text-align:right;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
               style="max-width:600px;background:#ffffff;border-radius:8px;border:1px solid #dee2e6;padding:32px;">
          <tr>
            <td style="text-align:right;">
              <div style="font-size:22px;font-weight:bold;color:#0d6efd;margin-bottom:8px;" dir="ltr">Tabsan EduSphere</div>
              <div style="font-size:12px;color:#6c757d;margin-bottom:24px;">کیمپس مینجمنٹ پورٹل</div>

              <p style="margin:0 0 10px 0;font-size:12px;color:#607089;">اطلاع کی قسم: {{TYPE}}</p>
              <h2 style="margin:0 0 12px 0;font-size:20px;line-height:1.5;color:#1f2a3d;">{{TITLE}}</h2>
              <p style="margin:0 0 16px 0;font-size:15px;line-height:1.8;color:#2f3d55;">{{BODY}}</p>
              <p style="margin:0 0 20px 0;font-size:12px;color:#6f7f97;">بھیجی گئی (UTC): <span dir="ltr">{{CREATED_AT_UTC}}</span></p>
              <a href="{{PORTAL_URL}}" style="display:inline-block;padding:10px 16px;border-radius:8px;background:#0d6efd;color:#ffffff;text-decoration:none;font-weight:600;">اطلاعات کھولیں</a>

              <hr style="border:none;border-top:1px solid #dee2e6;margin:0 0 16px;" />
              <p style="margin:0;font-size:12px;color:#6c757d;">یہ ای میل Tabsan EduSphere نے خودکار طور پر بھیجی ہے۔ براہ کرم جواب نہ دیں۔</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

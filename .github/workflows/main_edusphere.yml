# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - EduSphere

# Manual only (Actions tab, "Run workflow") until the Azure sign-in is repaired: azure/login fails with
# "No subscriptions found" for this app registration. To deploy on every push to main again, put back under on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build Tabsan.EduSphere.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Tabsan.EduSphere.Web/Tabsan.EduSphere.Web.csproj -c Release -o "${{ runner.temp }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_985236497C844115884188139E59E2F4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AAC3A5450D484D09910FDEE66A1A922D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F8D43C49F384E9DA1702BFE601F40C3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EduSphere'
          slot-name: 'Production'
          package: .
          